# A pull request whose body skips the template is closed, with the list of what is missing and the way
# back: go through "Before you open a pull request" in CODING_STANDARDS.md, fill the template, reopen
# or open a new one.
#
# ── What is checked ─────────────────────────────────────────────────────────────────────────────
# The sections "Who needs this", "What changed", "Why" and "Verified how" each hold text once the
# template's HTML comments are removed, "Evidence" is present (n/a is an answer), and three boxes are
# ticked: the duplicate search, the one-point rule and `npm run verify`. That is the part of the
# template a reviewer cannot recover from the diff.
#
# ── Who is checked ──────────────────────────────────────────────────────────────────────────────
# Pull requests from a fork only. Dependabot, the beta release branches and maintainers push to this
# repository, and a fork cannot claim to be it, unlike a branch name or `author_association`, which
# reports a private org member as a plain contributor.
#
# ── `pull_request_target`, and why it is safe here ──────────────────────────────────────────────
# Commenting and closing need a writable token, which a fork's pull request only gets here. The job
# checks out nothing and runs nothing from the branch; it reads the body from the event payload
# through an environment variable, never interpolated into the script.
#
# It fires on `opened` and `reopened` only, so a fixed body is checked again when the pull request is
# reopened or opened anew, and an edit on an already-answered pull request does not repeat the comment.
name: pull request template

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  template:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Check the body against the template
        id: check
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          node <<'JS' > missing.md
          const body = (process.env.BODY ?? "").replace(/<!--[\s\S]*?-->/g, "");
          const sections = {};
          let current;
          for (const line of body.split(/\r?\n/)) {
            const heading = /^##\s+(.+?)\s*$/.exec(line);
            if (heading) sections[(current = heading[1].toLowerCase())] = "";
            else if (current) sections[current] += line + "\n";
          }
          const missing = [];
          for (const name of ["Who needs this", "What changed", "Why", "Verified how"]) {
            if (!sections[name.toLowerCase()]?.trim()) missing.push(`the "${name}" section is missing or empty`);
          }
          if (!("evidence" in sections)) missing.push('the "Evidence" section is missing (n/a is an answer)');
          const verified = sections["verified how"] ?? "";
          for (const [box, label] of [
            [/searched open, closed and merged/i, "the duplicate search"],
            [/one point/i, "the one-point rule"],
            [/npm run verify/i, "`npm run verify`"],
          ]) {
            const line = verified.split("\n").find((l) => box.test(l));
            if (!line || !/^\s*-\s*\[[xX]\]/.test(line)) missing.push(`the box for ${label} is not ticked`);
          }
          for (const item of missing) console.log(`- ${item}`);
          JS
          if [ -s missing.md ]; then echo "failed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Explain and close
        if: steps.check.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## This pull request does not follow the template"
            echo
            cat missing.md
            echo
            echo "Before reopening, go through **Before you open a pull request** in"
            echo "[CODING_STANDARDS.md](https://github.com/$GITHUB_REPOSITORY/blob/HEAD/CODING_STANDARDS.md#before-you-open-a-pull-request)"
            echo "and stop at any check that fails."
            echo "Then fill the body from the pull request template and reopen this pull request, or open a new"
            echo "one if GitHub does not offer to reopen it. Either way this check runs again."
          } > comment.md
          gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          gh pr close "$NUMBER" --repo "$GITHUB_REPOSITORY"
          exit 1
